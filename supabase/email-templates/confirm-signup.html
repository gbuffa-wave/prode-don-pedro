<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background-color:#0D1510;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0D1510;">
    <tr>
      <td align="center" style="padding:32px 12px;">
        <table width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;">

          <!-- Header -->
          <tr>
            <td align="center" style="background-color:#101E19;padding:28px 24px 24px;border-radius:12px 12px 0 0;border-bottom:2px solid #FF4122;">
              <img src="https://prode-don-pedro.vercel.app/logo-don-pedro.png" alt="Don Pedro" width="140" height="40" style="height:30px;width:auto;display:block;margin:0 auto 14px;" />
              <table cellpadding="0" cellspacing="0" style="margin:0 auto;">
                <tr>
                  <td style="font-size:22px;font-weight:900;color:#F9F9F9;letter-spacing:-0.5px;">Prode</td>
                  <td style="font-size:22px;font-weight:900;color:#FF4122;letter-spacing:-0.5px;padding-left:6px;">2026</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="background-color:#0D1510;padding:32px 24px 24px;border-left:1px solid #1E3428;border-right:1px solid #1E3428;">
              <p style="color:#F9F9F9;font-size:20px;font-weight:700;margin:0 0 8px;">¡Bienvenido al Prode!</p>
              <p style="color:#A8B8B0;font-size:14px;line-height:1.6;margin:0 0 28px;">
                Confirmá tu email para empezar a pronosticar los partidos del Mundial 2026.
              </p>
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <a href="{{ .ConfirmationURL }}"
                       style="display:inline-block;background-color:#FF4122;color:#FFFFFF;font-weight:700;font-size:14px;padding:14px 44px;border-radius:8px;text-decoration:none;letter-spacing:0.3px;">
                      ✅ Confirmar email
                    </a>
                  </td>
                </tr>
              </table>
              <p style="color:#50605B;font-size:11px;text-align:center;margin:20px 0 0;line-height:1.5;">
                Si no creaste una cuenta en el Prode Don Pedro, podés ignorar este email.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="background-color:#101E19;padding:18px 24px;border-radius:0 0 12px 12px;border:1px solid #1E3428;border-top:none;">
              <p style="color:#50605B;font-size:10px;margin:0;text-transform:uppercase;letter-spacing:1px;">
                Prode Mundial 2026 &mdash; Don Pedro
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
